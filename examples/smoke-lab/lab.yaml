lab_id: smoke-coefficient
domain: synthetic

source:
  dir: ./src/
  allowed_patterns:
    - "**/*.py"
    - "**/*.yaml"

executor:
  # Executed with cwd = source.dir (./src), so the module is `stub_run`,
  # not `src.stub_run`. config_path is passed absolute, so cwd doesn't affect it.
  run_command: "python3 -m stub_run --config {config_path}"
  smoke_command: "python3 -m stub_run --config {config_path} --smoke"
  config_template: ../configs/default.yaml
  run_timeout_s: 60
  smoke_timeout_s: 30

metrics:
  headline:
    column: synthetic_loss
    direction: min
  panels:
    - { column: synthetic_loss, label: "Loss" }
  flat_digest_epsilon: 0.005

budget:
  daily_cap_usd: 2.0
  sonnet_default: true

# Optional: how often the loop synthesizes. Defaults suit a long-running lab
# (digest every 40 runs / 4 h, paper every 20 runs / 6 h). A bounded session
# such as a workshop lowers them so progress is visible within minutes. Any
# key can also be overridden per daemon with EFFERENTS_CADENCE_<KEY>.
# cadence:
#   runs_per_digest: 3
#   hours_per_digest: 0.1667
#   min_runs_for_digest: 1
#   runs_per_paper: 5
#   hours_per_paper: 0.5
#   empty_queue_sleep_s: 20
#   step_pause_s: 20
#   researcher_min_interval_s: 360
#   stall_hours: 0.25
#   backoff_cap_s: 300
