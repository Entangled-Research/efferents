name: efferents

# Linux-only deployment: host networking lets Caddy reach the gateway's
# existing loopback listener without exposing port 8800 on a public address.
# Keep the Droplet firewall open only for SSH, HTTP, and HTTPS.
services:
  event-service:
    build:
      context: ../..
      dockerfile: deploy/event_gateway/Dockerfile
    image: efferents-event-service:local
    init: true
    restart: unless-stopped
    network_mode: host
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      EVENT_ID: "${EVENT_ID:?Set EVENT_ID in deploy/digitalocean/.env}"
      EVENT_PUBLIC_URL: "https://${EFFERENTS_HOSTNAME:?Set EFFERENTS_HOSTNAME in deploy/digitalocean/.env}"
      EVENT_ENROLLMENT_CODE: "${EVENT_ENROLLMENT_CODE:?Set EVENT_ENROLLMENT_CODE in deploy/digitalocean/.env}"
      EVENT_ADMIN_KEY: "${EVENT_ADMIN_KEY:?Set EVENT_ADMIN_KEY in deploy/digitalocean/.env}"
      EVENT_EXPIRES_AT: "${EVENT_EXPIRES_AT:?Set EVENT_EXPIRES_AT in deploy/digitalocean/.env}"
      EVENT_TOKEN_CAP_USD: "${EVENT_TOKEN_CAP_USD:-3.0}"
      EVENT_TOTAL_CAP_USD: "${EVENT_TOTAL_CAP_USD:-50.0}"
      EVENT_REQUESTS_PER_MINUTE: "${EVENT_REQUESTS_PER_MINUTE:-30}"
      EVENT_STALE_AFTER_SECONDS: "${EVENT_STALE_AFTER_SECONDS:-180}"
      EVENT_MAX_OUTPUT_TOKENS: "${EVENT_MAX_OUTPUT_TOKENS:-16384}"
      EVENT_AZURE_OPENAI_BASE: "${EVENT_AZURE_OPENAI_BASE:?Set EVENT_AZURE_OPENAI_BASE in deploy/digitalocean/.env}"
      EVENT_AZURE_OPENAI_API_KEY: "${EVENT_AZURE_OPENAI_API_KEY:?Set EVENT_AZURE_OPENAI_API_KEY in deploy/digitalocean/.env}"
      EVENT_AZURE_FAST_DEPLOYMENT: "${EVENT_AZURE_FAST_DEPLOYMENT:?Set EVENT_AZURE_FAST_DEPLOYMENT}"
      EVENT_AZURE_FAST_INPUT_USD_PER_MTOK: "${EVENT_AZURE_FAST_INPUT_USD_PER_MTOK:?Set Azure fast input price}"
      EVENT_AZURE_FAST_OUTPUT_USD_PER_MTOK: "${EVENT_AZURE_FAST_OUTPUT_USD_PER_MTOK:?Set Azure fast output price}"
      EVENT_AZURE_STANDARD_DEPLOYMENT: "${EVENT_AZURE_STANDARD_DEPLOYMENT:?Set EVENT_AZURE_STANDARD_DEPLOYMENT}"
      EVENT_AZURE_STANDARD_INPUT_USD_PER_MTOK: "${EVENT_AZURE_STANDARD_INPUT_USD_PER_MTOK:?Set Azure standard input price}"
      EVENT_AZURE_STANDARD_OUTPUT_USD_PER_MTOK: "${EVENT_AZURE_STANDARD_OUTPUT_USD_PER_MTOK:?Set Azure standard output price}"
      EVENT_AZURE_DEEP_DEPLOYMENT: "${EVENT_AZURE_DEEP_DEPLOYMENT:?Set EVENT_AZURE_DEEP_DEPLOYMENT}"
      EVENT_AZURE_DEEP_INPUT_USD_PER_MTOK: "${EVENT_AZURE_DEEP_INPUT_USD_PER_MTOK:?Set Azure deep input price}"
      EVENT_AZURE_DEEP_OUTPUT_USD_PER_MTOK: "${EVENT_AZURE_DEEP_OUTPUT_USD_PER_MTOK:?Set Azure deep output price}"
    volumes:
      - event_data:/data/event
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/healthz', timeout=3).read(1)"
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    build:
      context: ../..
      dockerfile: deploy/digitalocean/Dockerfile
    image: efferents-gateway:local
    init: true
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # SIGINT uses the server's existing graceful shutdown handler. Stop live
    # labs explicitly with `efferents stop` before restarting this container;
    # detached lab daemons are not automatically resumed on container restart.
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      EFFERENTS_HOME: /data/efferents
      POPPER_PROBE_REPO: /data/popper-probe
      EFFERENTS_EVENT_NETWORK_URL: "http://127.0.0.1:8801/event/v1/network?event_id=${EVENT_ID}"
      EFFERENTS_EVENT_ADMIN_KEY: "${EVENT_ADMIN_KEY}"
    # The organizer gateway receives no provider or participant credentials.
    # Only the separate event-service receives the upstream vendor key.
    volumes:
      - efferents_data:/data
    tmpfs:
      - /tmp:mode=1777,size=256m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/', timeout=3).read(1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      gateway:
        condition: service_healthy
      event-service:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      EFFERENTS_HOSTNAME: "${EFFERENTS_HOSTNAME:?Set EFFERENTS_HOSTNAME in deploy/digitalocean/.env}"
      EFFERENTS_AUTH_USER: "${EFFERENTS_AUTH_USER:-organizer}"
      EFFERENTS_AUTH_HASH: "${EFFERENTS_AUTH_HASH:?Set EFFERENTS_AUTH_HASH in deploy/digitalocean/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:mode=1777,size=32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named volumes survive rebuilds/restarts and `docker compose down`.
  # `docker compose down -v` deletes event history and TLS keys.
  efferents_data:
  event_data:
  caddy_data:
  caddy_config:
